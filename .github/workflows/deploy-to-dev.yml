# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Deploy to DEV

on:
  workflow_call:
    inputs:
      serviceName:
        description: 'Service name'
        type: string

env:
  AZURE_CONTAINER_REGISTRY: "acrsimplechaindev.azurecr.io"
  AKS_RESOURCE_GROUP: "rg-dev-foundation"
  AKS_CLUSTER_NAME: "aks-dev-foundation"
  AZURE_SUBSCRIPTION_ID_DEV: "60d5585d-bac5-4c27-ba3b-f5d255a13fc2"

permissions:
  id-token: write
  contents: write
  actions: read

jobs:

  deploy_to_dev:  
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Running Deploy to DEV
      run: echo "Deploy to DEV"

    # Login to ACR
    - uses: azure/login@v2
      env:
        AZURE_LOGIN_PRE_CLEANUP: true
        AZURE_LOGIN_POST_CLEANUP: true
      with:
        creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID_ACR }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'
    - name: Log in to Azure Container Registry
      run: az acr login --name acrsimplechaindev

    - name: Helm login & Pull Chart
      run: |
        cd ${HOME}
        export TAG=$(echo "$GITHUB_REF" | cut -d "/" -f3)
        echo "TAG value is : $TAG"
        mkdir helm
        cd helm
        echo "Pull Chart Name ${{ inputs.serviceName }} with version $TAG"
        helm pull oci://${{ env.AZURE_CONTAINER_REGISTRY }}/helm/${{ inputs.serviceName }} --version $TAG --untar
        ls
        echo "Show Values YAML inside Helm Chart before replacing"
        cat ${{ inputs.serviceName }}/values.yaml
        echo "Show values YAML after replacing"
        cat ${{ inputs.serviceName }}/values.yaml

    # Login to Azure DEV Subscription
    - uses: azure/login@v2
      with:
        creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ env.AZURE_SUBSCRIPTION_ID_DEV }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'
      env:
        AZURE_LOGIN_PRE_CLEANUP: true
        AZURE_LOGIN_POST_CLEANUP: true

    - name: Azure CLI script
      uses: azure/cli@v2
      with:
        azcliversion: latest
        inlineScript: |
          az account show
          
    - name: Connect to AKS & Run Helm Upgrade
      run: |
        az aks get-credentials --resource-group ${{ env.AKS_RESOURCE_GROUP }} --name ${{ env.AKS_CLUSTER_NAME }} --overwrite-existing
        helm ls -n otel
