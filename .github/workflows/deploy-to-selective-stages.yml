name: Deploy to Selective Stages

on:
  workflow_call: # This will allow manual triggering of the workflow
    inputs:
      dev:
        description: 'DEV'
        required: true
        type: boolean
      int:
        description: 'INT'
        required: true
        type: boolean
      stage:
        description: 'STAGE'
        required: true
        type: boolean
      prod:
        description: 'PROD'
        required: true
        type: boolean
      serviceName:
        description: 'Service name'
        required: true
        type: string
    

jobs:

  deploy_to_dev:
    permissions:
      id-token: write
      contents: write
      actions: read
    if: ${{ inputs.dev }}
    uses: ./.github/workflows/deploy-to-dev.yml
    with:
      serviceName: ${{ inputs.serviceName }}
    secrets: inherit

  deploy_to_int:
    permissions:
      id-token: write
      contents: write
      actions: read
    if: ${{ inputs.int }}
    uses: ./.github/workflows/deploy-to-dev.yml
    with:
      serviceName: ${{ inputs.serviceName }}
    secrets: inherit

  deploy_to_stage:
    permissions:
      id-token: write
      contents: write
      actions: read
    if: ${{ inputs.stage }}
    uses: ./.github/workflows/deploy-to-dev.yml
    with:
      serviceName: ${{ inputs.serviceName }}
    secrets: inherit

  deploy_to_prod:
    permissions:
      id-token: write
      contents: write
      actions: read
    if: ${{ inputs.prod }}
    uses: ./.github/workflows/deploy-to-dev.yml
    with:
      serviceName: ${{ inputs.serviceName }}
    secrets: inherit

