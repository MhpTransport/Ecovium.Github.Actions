name: Deploy to all Stages

on:
  workflow_call: # This will allow manual triggering of the workflow
    inputs:
      environment:
        type: choice
        description: 'Select Environment to deploy'
        required: true
        default: 'all'
        options:
          - 'all'
    
env:
  AZURE_CONTAINER_REGISTRY: "your-azure-container-registry"
  CONTAINER_NAME: "your-container-name"
  RESOURCE_GROUP: "your-resource-group"
  CLUSTER_NAME: "your-cluster-name"
  CHART_PATH: "your-chart-path"
  CHART_OVERRIDE_PATH: "your-chart-override-path"

jobs:

  deploy_to_dev:
  
    permissions:
      actions: read
      contents: read
      id-token: write

    runs-on: ubuntu-latest

    env:
      serviceName: portal-host-ui
      acrName: acrsimplechaindev.azurecr.io
      HELM_EXPERIMENTAL_OCI: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Helm login & Pull Chart
        run: |
          cd ${HOME}
          export TAG=$(echo "$GITHUB_REF" | cut -d "/" -f3)
          echo "TAG value is : $TAG"
          echo "Target Environment is DEV"


  deploy_to_int:
  
    permissions:
      actions: read
      contents: read
      id-token: write

    runs-on: ubuntu-latest
    needs: deploy_to_dev
    if: ${{ success() }}
    
    env:
      serviceName: portal-host-ui
      acrName: acrsimplechaindev.azurecr.io
      HELM_EXPERIMENTAL_OCI: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Helm login & Pull Chart
        run: |
          cd ${HOME}
          export TAG=$(echo "$GITHUB_REF" | cut -d "/" -f3)
          echo "TAG value is : $TAG"
          echo "Target Environment is INT"


  deploy_to_stage:
  
    permissions:
      actions: read
      contents: read
      id-token: write

    runs-on: ubuntu-latest
    needs: deploy_to_int
    if: ${{ success() }}

    env:
      serviceName: portal-host-ui
      acrName: acrsimplechaindev.azurecr.io
      HELM_EXPERIMENTAL_OCI: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Helm login & Pull Chart
        run: |
          cd ${HOME}
          export TAG=$(echo "$GITHUB_REF" | cut -d "/" -f3)
          echo "TAG value is : $TAG"
          echo "Target Environment is STAGE"


  deploy_to_prod:
  
    permissions:
      actions: read
      contents: read
      id-token: write

    runs-on: ubuntu-latest
    needs: deploy_to_stage
    if: ${{ success() }}

    env:
      serviceName: portal-host-ui
      acrName: acrsimplechaindev.azurecr.io
      HELM_EXPERIMENTAL_OCI: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Helm login & Pull Chart
        run: |
          cd ${HOME}
          export TAG=$(echo "$GITHUB_REF" | cut -d "/" -f3)
          echo "TAG value is : $TAG"
          echo "Target Environment is PROD"
